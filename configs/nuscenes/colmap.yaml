ddp:
  ddp_enable: False
  world_size: 1
  gpus: [0]

model:
  # mode: 'MF' or 'SF' (overridden by --novel_view_mode; use SF for custom data)
  novel_view_mode: 'SF'

  num_layers: 18
  weights_init: True

  fusion_level: 2
  fusion_feat_in_dim: 256
  use_skips: False

  voxel_unit_size: [1.0, 1.0, 1.5]
  voxel_size: [100, 100, 20]
  voxel_str_p: [-50.0, -50.0, -15.0]
  voxel_pre_dim: [64]
  proj_d_bins: 50
  proj_d_str: 2
  proj_d_end: 50

data:
  # Point this at your COLMAP reconstruction directory (the folder that
  # contains cameras.json and sparse/txt/images.txt). On Windows set e.g.
  #   data_path: 'E:/3DGS/Datasets/colmap_test_full/'
  data_path: './input_data/colmap_test_full/'
  log_dir: './results/'
  dataset: 'colmap'
  back_context: 1
  forward_context: 1
  depth_type: 'lidar'          # unused by ColmapDataset (kept for parity)
  # 6 cameras mapped onto the nuScenes layout order so the fusion net's
  # 6-cam overlap grouping ([0,3,4] / [1,2,5]) applies. Semantic mapping:
  #   0 CAM_FRONT       -> mid_center_top_wide   (front-centre; fisheye)
  #   1 CAM_FRONT_LEFT  -> front_left_bottom_wide
  #   2 CAM_FRONT_RIGHT -> front_right_bottom_wide
  #   3 CAM_BACK_LEFT   -> rear_left_bottom_wide
  #   4 CAM_BACK_RIGHT  -> rear_right_bottom_wide
  #   5 CAM_BACK        -> rear_center_top_norm   (rear-centre)
  # NOTE: this rig/intrinsics differ from nuScenes, so cross-camera fusion is
  # only approximate -- expect poor metrics (flow-through / pipeline check).
  cameras: ['mid_center_top_wide', 'front_left_bottom_wide', 'front_right_bottom_wide', 'rear_left_bottom_wide', 'rear_right_bottom_wide', 'rear_center_top_norm']
  # No lidar GT depth and no self-occlusion masks for custom data.
  train_requirements: (gt_pose, gt_ego_pose)
  val_requirements: (gt_pose, gt_ego_pose)

training:
  # basic
  height: 352
  width: 640
  scales: [0]
  frame_ids: [0, -1, 1]

  # optimization
  batch_size: 1
  num_workers: 4
  learning_rate: 0.0001
  num_epochs: 10
  scheduler_step_size: 15

  # model / loss setting
  ## depth range
  min_depth: 1.5
  max_depth: 80.0

  ## spatio & temporal
  spatio: True
  spatio_temporal: True

  ## gaussian
  gaussian: True

  ## intensity align
  intensity_align: True

  ## focal length scaling
  focal_length_scale: 300

# Loss hyperparams
loss:
  disparity_smoothness: 0.001
  spatio_coeff: 0.03
  spatio_tempo_coeff: 0.1
  gaussian_coeff: 0.01
  pose_loss_coeff: 0.0

eval:
  eval_batch_size: 1
  eval_num_workers: 0
  eval_min_depth: 0
  eval_max_depth: 80
  eval_visualize: False
  save_images: True
  save_path: './results/images_colmap'
  export_ply: true
  export_ply_path: './results/ply_colmap'
  # .ply downsampling (both null = keep ALL points). See main.yaml for notes.
  export_ply_max_points: null
  export_ply_voxel_size: null

load:
  pretrain: False
  models_to_load: ['depth_net', 'gs_net']
  load_dir: path to weights directory

logging:
  early_phase: 5000
  log_frequency: 1000
  late_log_frequency: 5000
  save_frequency: 1
